<!DOCTYPE html>

        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1B4332", // Forest Mint Ledger Core
              "on-primary": "#ffffff",
              "surface": "#f9f9f8",
              "surface-container-low": "#f3f4f3",
              "surface-container": "#edeeed",
              "surface-container-high": "#e7e8e7",
              "on-surface": "#191c1c",
              "on-surface-variant": "#414844",
              "outline-variant": "#c1c8c2",
              "secondary-container": "#D1FAE5", // Light mint for active states
              "on-secondary-container": "#064E3B",
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "1rem"},

<style>

        background-color: #f9f9f8;
        color: #191c1c;
        font-family: 'Inter', sans-serif;

      .headline-font { font-family: 'Manrope', sans-serif; }
      .primary-gradient {
        background: linear-gradient(135deg, #1B4332 0%, #2D5A47 100%);

<div class="absolute -bottom-1 -right-1 bg-emerald-500 text-white rounded-lg p-0.5 border-2 border-surface">
<span class="material-symbols-outlined text-[14px] font-bold">add</span>
</div>
</div>
<span class="text-[11px] font-bold text-center headline-font text-on-surface truncate w-full">Priya Sharma</span>
</div>
<!-- Suggestion 3 -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">

<div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-transparent group-hover:border-primary transition-all">
<img alt="Rahul K" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxpQOZ0G5NZCGKvHpucP6Foi47lB31x3PZE2KSpp2QpMQK1-lysgw9xEHrd0LbRcuW51E2Ajz0DpIgZRp0RK5gtZNbH_87ehdv89PzP6yNbSKiimGeFrle4gURq4DnsjPk07zpFk--eOKOhPTfBygQuMdzQ3Ak6jt44J0yo6RnzV11NX7wX1S5a4_ff1mLhPhk04vHHdGIo0z3vfDDwtRTXgd03q3hQxtLQ1SiKDPncTgdTeg51l7wpkASjdIt7WFpHzFc_u_f-PvG"/>

</div>

<span class="text-[11px] font-bold text-center headline-font text-on-surface truncate w-full">Ananya V.</span>
</div>
</div>

<!-- Manual UPI Entry -->
<section class="space-y-4">
<h3 class="headline-font text-xs font-bold text-on-surface-variant uppercase tracking-widest">Manual UPI ID Entry</h3>
<div class="bg-surface-container rounded-2xl p-4 flex items-center gap-4 focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-primary">alternate_email</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full headline-font font-bold text-lg text-primary placeholder:text-outline-variant" placeholder="username@upi" type="text"/>
</div>
<p class="text-[10px] text-on-surface-variant/70 italic px-2">Verified UPI IDs allow direct settlement to bank accounts.</p>
</section>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-28 right-6">
<button class="primary-gradient text-on-primary py-4 px-6 rounded-2xl shadow-xl shadow-primary/30 active:scale-95 transition-all flex items-center gap-3">
<span class="font-bold headline-font">Add to Group</span>
<span class="material-symbols-outlined">group_add</span>
</button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-3 bg-white/90 backdrop-blur-xl border-t border-surface-container-high rounded-t-[2rem]">

<!-- Friends (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-2xl px-6 py-2">

<span class="text-[10px] font-bold font-label uppercase tracking-wider mt-1">Friends</span>

<!-- Settle -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 px-6 py-2 hover:text-primary transition-colors">
